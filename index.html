<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta id="vp" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      /*
       * A tablet (any touch screen 600 px or more on its short side: iPads, which call themselves a Mac, Android
       * tablets, old and new) shows the phone's version of the site, as a phone shows it, only larger: the page is laid
       * out at a phone's width, about as tall as a phone's screen (740 px held upright, 760 sideways), and the browser scales it up to fill the
       * screen, words, cards and 3D alike. Never wider than 1180 px, where the phone's version ends for a touch screen. Set again as it turns. A computer (no touch screen, a MacBook included) is left as it is.
       */
      ;(function () {
        var touch = (navigator.maxTouchPoints || 0) > 1 || 'ontouchstart' in window
        var short = Math.min(screen.width, screen.height)
        var long = Math.max(screen.width, screen.height)
        if (!touch || short < 600) return
        var meta = document.getElementById('vp')
        var set = function () {
          var wide = window.matchMedia('(orientation: landscape)').matches
          var w = wide ? long : short
          var h = wide ? short : long
          var at = Math.max(480, Math.min(1180, Math.round((w * (wide ? 760 : 740)) / h)))
          meta.setAttribute('content', 'width=' + at + ', viewport-fit=cover')
          document.documentElement.classList.add('is-tablet')
        }
        set()
        window.addEventListener('orientationchange', function () {
          setTimeout(set, 60)
        })
        var mq = window.matchMedia('(orientation: landscape)')
        if (mq.addEventListener) mq.addEventListener('change', set)
      })()
    </script>
    <meta name="theme-color" content="#080808" />
    <title>RTARIUM by HEMISPHERE ONE · Three-dimensional basalt reinforcement mesh</title>
    <meta
      name="description"
      content="RTARIUM is a three-dimensional basalt spacer mesh for thin, high-performance concrete: two basalt mesh faces held apart by connecting fibres, for flooring, cladding and façades, and wall panels. By HEMISPHERE ONE."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="fetch" href="/models/rtarium-cell-t10.glb" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/brand/rtarium-emblem.png" />
    <!--
      The opening, shown from the first paint, before the site's script has run (src/opener.ts plays it): black, the
      RTARIUM emblem in the middle filling with yellow as the page, its fonts and its 3D load; then the emblem becomes a
      window onto the page, and the black parts down its middle as two doors, left and right, each with half the emblem
      cut from its edge, the window opening wide as they go. If the script never runs, it gives way by itself.
    -->
    <style>
      @property --em {
        syntax: '<length>';
        inherits: true;
        initial-value: 96px;
      }
      html.is-opening,
      html.is-opening body {
        overflow: hidden;
      }
      .opener {
        --em: clamp(72px, 11vmin, 128px);
        --p: 0;
        --ease: cubic-bezier(0.53, 0, 0, 1);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        /* (a fail-safe, should the script never run: a phone's Home may hold it up to 18 s while it makes every scene) */
        animation: opener-bail 0.6s 20s forwards;
      }
      @keyframes opener-bail {
        to {
          visibility: hidden;
          opacity: 0;
        }
      }
      .opener__door {
        position: absolute;
        top: 0;
        bottom: 0;
        width: calc(50% + 1px);
        background: #080808;
        transition: transform 1.25s var(--ease);
        will-change: transform;
      }
      .opener__door--l {
        left: 0;
      }
      .opener__door--r {
        right: 0;
      }
      /* the emblem: faint, and filling with yellow from its foot as what the page needs comes in */
      .opener__mark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--em);
        height: var(--em);
        transform: translate(-50%, -50%);
        transition: opacity 0.3s ease;
        -webkit-mask: url(/brand/rtarium-emblem.png) center / contain no-repeat;
        mask: url(/brand/rtarium-emblem.png) center / contain no-repeat;
      }
      .opener__mark::before,
      .opener__fill {
        content: '';
        position: absolute;
        inset: 0;
      }
      .opener__mark::before {
        background: rgb(253 208 1 / 0.16);
      }
      /* (filled by a transform the compositor glides between the script's steps: drawn with a clip set every frame, it
         stuttered whenever the page was busy building its scenes behind it) */
      .opener__fill {
        background: #fdd001;
        transform-origin: 50% 100%;
        transform: scaleY(var(--p));
        transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        will-change: transform;
      }
      /* the emblem a window: each door with its half cut from the edge where they meet */
      .opener.is-cut .opener__mark {
        opacity: 0;
      }
      /* under the emblem, what the page is being made of, a line at a time (src/opener.ts, sayLines) */
      .opener__words {
        position: absolute;
        left: 24px;
        right: 24px;
        top: calc(50% + var(--em) / 2 + 26px);
        margin: 0;
        font: 600 11px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-align: center;
        color: rgb(242 240 233 / 0.62);
        transition:
          opacity 0.26s ease,
          transform 0.26s ease;
      }
      .opener__words.is-out {
        opacity: 0;
        transform: translateY(-6px);
      }
      .opener.is-cut .opener__words {
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .opener.is-cut .opener__door {
        -webkit-mask-image: url(/brand/rtarium-emblem.png), linear-gradient(#000 0 0);
        mask-image: url(/brand/rtarium-emblem.png), linear-gradient(#000 0 0);
        -webkit-mask-size: var(--em) var(--em), 100% 100%;
        mask-size: var(--em) var(--em), 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }
      /* (the emblem's middle on the edge where the doors meet, half of it on each door) */
      .opener.is-cut .opener__door--l {
        -webkit-mask-position: right calc(var(--em) / -2 + 1px) top 50%, 0 0;
        mask-position: right calc(var(--em) / -2 + 1px) top 50%, 0 0;
      }
      .opener.is-cut .opener__door--r {
        -webkit-mask-position: left calc(var(--em) / -2 + 1px) top 50%, 0 0;
        mask-position: left calc(var(--em) / -2 + 1px) top 50%, 0 0;
      }
      /* open: the doors part, left and right, and the window in them opens wide as they go: each door grows from the edge
         where they meet as it slides away, a transform the compositor plays (the window grown by resizing its mask had
         the whole screen painted again every frame, and lagged on a phone) */
      .opener.is-open {
        pointer-events: none;
      }
      .opener.is-open .opener__door--l {
        transform-origin: 100% 50%;
        transform: translateX(-101%) scale(3);
      }
      .opener.is-open .opener__door--r {
        transform-origin: 0% 50%;
        transform: translateX(101%) scale(3);
      }
      .opener.is-fade {
        opacity: 0;
        transition: opacity 0.45s ease;
      }
    </style>
    <!-- the opening plays once a visit: on the site's first page, not on a reload or the pages after it; except on a phone,
         where it plays on every load (and every page opened after it: src/opener.ts `openOnPage`), every scene of the page
         made and its openings played behind it, none left to be built as the page scrolls -->
    <script>
      try {
        var phone = matchMedia('(max-width: 860px), (max-aspect-ratio: 4/5)').matches
        if (sessionStorage.getItem('rtarium:opened') && !phone) document.documentElement.classList.add('is-opened')
      } catch (e) {}
    </script>
    <style>
      html.is-opened .opener {
        display: none;
      }
    </style>
    <noscript><style>.opener { display: none; }</style></noscript>
  </head>
  <body>
    <div id="opener" class="opener" aria-hidden="true">
      <div class="opener__door opener__door--l"></div>
      <div class="opener__door opener__door--r"></div>
      <div class="opener__mark"><i class="opener__fill"></i></div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 48px; font-family: sans-serif; color: #f2f0e9; background: #080808">
        <h1>RTARIUM by HEMISPHERE ONE</h1>
        <p>
          A three-dimensional basalt spacer mesh for thin, high-performance concrete. This site needs JavaScript for
          its interactive 3D model.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
